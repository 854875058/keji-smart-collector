<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 渐变背景 - 绿色系，代表记录/成长 -->
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    
    <!-- 内部高光渐变 -->
    <linearGradient id="highlight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 图标背景 - 圆角矩形 -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="url(#bgGradient2)" filter="url(#shadow2)"/>
  
  <!-- 顶部高光 -->
  <rect x="64" y="64" width="896" height="448" rx="224" ry="224" fill="url(#highlight2)"/>
  
  <!-- 装饰性圆点 - 代表记录/记忆 -->
  <circle cx="280" cy="280" r="40" fill="#ffffff" opacity="0.9"/>
  <circle cx="744" cy="280" r="24" fill="#ffffff" opacity="0.6"/>
  
  <!-- KJ 字母组合设计 -->
  <g transform="translate(512, 512)" text-anchor="middle" dominant-baseline="central">
    <!-- K 字母 -->
    <text x="-110" y="20" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="380" 
          font-weight="800" 
          fill="#ffffff">K</text>
    
    <!-- J 字母 -->
    <text x="110" y="20" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="380" 
          font-weight="800" 
          fill="#ffffff">J</text>
  </g>
  

  
  <!-- 底部中文名 - 可记 -->
  <text x="512" y="820" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
        font-size="100" 
        font-weight="500" 
        fill="#ffffff"
        text-anchor="middle"
        opacity="0.95">可记</text>
</svg>